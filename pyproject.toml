[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "milestone1"
version = "0.1.0"
description = "Zomato AI Restaurant Recommendation System - Phase 1"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "datasets>=2.16.0",
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "groq>=0.4.2",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0"
]

[project.scripts]
milestone1 = "milestone1.cli:app"
